<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="One dreamlike scene at a time. Find what leads to the next."
    />
    <meta name="theme-color" content="#1f2a38" />
    <!-- An inline icon (a warm light on the night palette): without one the browser asks the
         host's root for /favicon.ico, which is another site's icon or a 404. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f2a38'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23f2c88f'/%3E%3C/svg%3E"
    />
    <!-- Fetch the manifest while the script loads; main.ts reuses this response. -->
    <link rel="preload" href="%BASE_URL%scenes.json" as="fetch" crossorigin="anonymous" />
    <title>Dreamscapes</title>
  </head>
  <body>
    <main id="app" class="app"></main>
    <noscript>Dreamscapes needs JavaScript to show its scenes.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
