  - id: lighthouse-gallery
    title: The lamp room
    alt: >-
      From inside a lighthouse lamp room at dusk, a stone cottage with one lit window can be seen
      on the cliff across the inlet, beyond the great glowing lens, an oil can and a crumpled paper
      lantern.
    scene: >-
      Dusk inside the lamp room at the top of a lighthouse, the sky clearing after a storm. The great
      faceted glass lens glows warm amber right of centre, throwing rings of light across the curved
      iron walls and the brass handrail. On the iron floor beside it lie an old oil can and a small
      crumpled paper lantern, its candle long out. Through the tall windows, across a narrow inlet
      of calm grey water, a stone cottage with a slate roof stands on the opposite clifftop, one window
      lit, framed whole within a single pane. Thin mist rises off the water.
    bridge:
      object: cottage
      placement: >-
        left of centre, seen through a single pane of the lamp-room glass on the clifftop across the
        inlet, about a quarter of the frame height tall including roof and chimney
