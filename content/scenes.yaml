  - id: prison-yard
    title: The empty yard
    alt: >-
      An empty prison yard at night, with a cracked basketball court and its hoop, puddles and chain-link
      fences lit through the fog by floodlights and a watchtower built like a lighthouse.
    scene: >-
      Deep night in the exercise yard of an abandoned prison, wrapped in low fog after rain. Cracked
      asphalt stretches away, the faded lines of an old basketball court half lost under shallow puddles
      that mirror the lights. Tall chain-link fences topped with coiled wire close in the yard, and
      floodlight towers pour hazy amber light down into the fog. The tallest watchtower is built exactly
      like a lighthouse, its lamp turning slowly so a pale beam sweeps across the yard. At the edge
      of the court stands a basketball hoop on a single steel pole, its net torn and its backboard
      plain. A lone ball rests against the fence.
