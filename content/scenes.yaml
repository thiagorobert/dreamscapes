  - id: overgrown-greenhouse
    title: The overgrown greenhouse
    alt: >-
      An overgrown Victorian greenhouse with fogged, dripping panes in the early evening, where a
      rusted bicycle leans against a potting bench and small birds roost around a birdcage hanging
      from the rafters.
    scene: >-
      Early evening in a Victorian greenhouse long ago reclaimed by plants, warm and humid, its glass
      panes fogged with condensation and beaded with drops from a passing shower. Ferns, palms and
      trailing vines spill over cast-iron staging and overrun the brick path. Small birds roost along
      the iron rafters, gathered around an empty brass birdcage that hangs open from a hook. Cracked
      terracotta pots and a dented watering can sit on a wooden potting bench. Leaning against the
      bench is an old rusted bicycle with a wicker basket full of moss, a single tendril of ivy curling
      around its frame and its tyres gone flat.
    bridge:
      object: bicycle
      placement: >-
        lower left of centre, leaning against the potting bench in the middle distance, about a quarter
        of the frame width from wheel to wheel
      polygon:
