  - id: balloon-salt-flats
    title: The salt mirror
    alt: >-
      At dawn a lone wooden door stands upright with nothing behind it on a mirror-flat salt lake,
      under a fleet of motionless hot-air balloons and beside an empty wicker basket lying on the
      salt.
    scene: >-
      Dawn over a vast salt lake covered by a thin sheet of still water, so flat it mirrors the whole
      sky. A fleet of hot-air balloons in faded plain stripes hangs motionless at different heights,
      each one doubled perfectly in the reflection below. The air is windless, with a low band of
      pale mist along the horizon and soft lavender cloud above it. An empty wicker balloon basket
      lies on its side on the salt, ropes trailing. On a small island of dry, cracked salt crust stands
      a single free-standing wooden door in its frame, with nothing behind it, slightly ajar, a thin
      line of amber light glowing through the gap.
    bridge:
      object: wooden door
      placement: >-
        just right of centre on the island of dry salt in the middle distance, about a third of the
        frame height tall from threshold to lintel, casting a soft shadow rather than a reflection
      polygon:
