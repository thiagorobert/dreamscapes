  - id: mountain-road-phonebox
    title: The mountain road
    alt: >-
      A wet mountain road at night above a valley lost in mist, a glowing red telephone box at the
      hairpin bend with moths circling its light and an old bicycle leaning on the guardrail.
    scene: >-
      Night on a narrow mountain road, cool and clear after rain, the asphalt still wet and gleaming.
      The road curves along a dented steel guardrail toward a hairpin bend, and beyond the rail the
      valley drops away into a sea of moonlit mist with dark pine ridges rising from it. In the foreground
      an old bicycle with a wicker basket leans against the guardrail. At the hairpin stands a faded
      red telephone box with plain blank panels, glowing warm from within, moths circling its light.
      A row of pale marker posts follows the bend, and a single dim street lamp leans over the road
      further on.
    bridge:
      object: telephone box
      placement: >-
        right of centre at the hairpin bend in the middle distance, about a third of the frame height
        tall
      polygon:
        - [0.66, 0.4734]
        - [0.7332, 0.66]
        - [0.66, 0.8466]
        - [0.5868, 0.66]
