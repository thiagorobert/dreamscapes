  - id: rooftop-court
    title: Court above the city
    alt: >-
      A rooftop basketball court at blue hour above a sleeping city, a hot-air balloon drifting between
      dark towers beyond the parapet and a ball resting on the court under strings of unlit bulbs.
    scene: >-
      Blue hour on a flat rooftop high above a sleeping city, the air still and clear after a warm
      day. A painted basketball court covers the roof, its lines worn soft; a basketball hoop with
      a frayed net stands at the far end, and one ball rests on the free-throw line as if just set
      down. Strings of unlit festoon bulbs sag between two poles over the court, and a low brick parapet
      edges the roof. Beyond it, dark towers with a few amber windows fade into haze. Hanging low
      between two nearby towers, a lone hot-air balloon in faded plain stripes drifts in the windless
      air, its burner glowing faintly.
    bridge:
      object: hot-air balloon
