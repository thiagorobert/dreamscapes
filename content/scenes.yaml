  - id: drowned-street
    title: The drowned street
    alt: >-
      A city street drowned under clear water, seen looking up from the pavement, where the hull of
      a passing ship darkens the bright surface above drifting fish, dark shop windows and an open
      telephone box whose handset floats on its cord.
    scene: >-
      Midday on a calm, sunny day above a city street that lies drowned under deep, clear water, seen
      from the pavement looking gently upward. Shafts of rippling sunlight slant down from the bright
      surface far above. Rows of shopfronts with blank fascias and dark windows line both sides, and
      small silver fish drift past an empty bicycle rack and a leaning lamp post. On the corner stands
      a telephone box with its door open, the handset floating up on its coiled cord. Up at the surface,
      a passing ship's hull slides darkly across the light, its long shadow falling over the street.
    bridge:
      object: ship's hull
      placement: >-
        upper centre, entirely within the frame, crossing the bright surface about a fifth of the
        way down from the top edge, its dark underside about a third of the frame width long
      polygon:
        - [0.5, 0.0664]
        - [0.5928, 0.3268]
        - [0.4072, 0.3268]
      source: placeholder
      verified: false
      needs_manual_hotspot: false
    next: fog-ship-deck
