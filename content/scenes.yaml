  - id: cliff-cottage
    title: The cottage on the cliff
    alt: >-
      A stone cottage with one lit window stands on a stormy sea cliff, a lighthouse glowing faintly
      across the cove, waves breaking on the rocks below and a rowing boat pulled up on the shingle.
    scene: >-
      Late afternoon under a gathering storm. A stone cottage with a slate roof and one warmly lit
      window stands near the edge of a high sea cliff, filling the left of the view, its garden gate
      hanging open in the wind. Far below, grey-green waves break against black rocks, and a small
      wooden rowing boat lies pulled up on a strip of shingle. Across the cove, on a rocky headland,
      stands a stout pale stone lighthouse with a broad base and a railed lamp gallery, its lamp glowing
      faintly amber through the rain haze. Long grass lies flat along the cliff path, heavy lavender
      clouds roll in from the sea, and a thin mist hangs over the water.
    bridge:
