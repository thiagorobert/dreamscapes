  - id: fog-ship-deck
    title: Becalmed in fog
    alt: >-
      The empty deck of an old sailing ship becalmed in thick fog at night, a paper lantern glowing
      amber in the shrouds above the unattended wheel and a brass bell, the rigging fading into white.
    scene: >-
      Night aboard an old wooden sailing ship becalmed in thick, windless fog. The empty deck is wet
      and dark, water still dripping from the rigging as if the ship has just risen from the sea,
      and over the rail the curve of the ship's hull drops into black, glassy water. The ship's wheel
      stands unattended beside a plain brass bell hanging motionless from its frame. Ropes, shrouds
      and furled sails rise and dissolve into white mist. Hanging in the shrouds, a single round paper
      lantern glows warm amber, its light blooming softly in the fog.
    bridge:
      object: paper lantern
      placement: >-
        right of centre, hanging in the shrouds close to the viewer at about the middle of the frame
        height, about a quarter of the frame height tall
      polygon:
