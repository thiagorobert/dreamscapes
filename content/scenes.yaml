  - id: endless-library
    title: The endless library
    alt: >-
      An impossibly tall library of spiralling shelves and ladders where dust drifts in shafts of
      light, with a door ajar below the shelves and an open birdcage, a globe and a lamp on a reading
      table.
    scene: >-
      Late morning inside an impossibly tall library, soft rain ticking on a glass skylight far overhead.
      Shelves of books with plain unmarked spines spiral upward into haze, linked by wooden ladders
      and narrow balconies, and dust drifts through slanting shafts of pale light. A tall wooden door
      stands ajar at the foot of the nearest shelves, a fine drift of white salt across its threshold.
      In the foreground a long reading table holds an antique globe with faded, unlabelled continents,
      a brass reading lamp with a teal glass shade glowing amber, a few closed books, and a small
      brass birdcage with its door wide open, empty.
    bridge:
      object: birdcage
      placement: >-
        left of centre on the reading table in the foreground, about a third of the frame height tall
        from its base to the ring at the top of its dome
      polygon:
